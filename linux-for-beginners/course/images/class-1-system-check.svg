<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title description">
  <title id="title">Example Ubuntu system-check output</title>
  <desc id="description">An illustrated terminal shows Ubuntu 24.04, the codespace user, the course workspace path, and an example hostname. The hostname varies by learner.</desc>
  <rect width="760" height="340" rx="18" fill="#10172b"/>
  <path d="M0 18a18 18 0 0 1 18-18h724a18 18 0 0 1 18 18v38H0z" fill="#202a43"/>
  <circle cx="27" cy="28" r="6" fill="#ff765f"/>
  <circle cx="49" cy="28" r="6" fill="#f3c75e"/>
  <circle cx="71" cy="28" r="6" fill="#8fc88a"/>
  <text x="380" y="33" fill="#c1c6d3" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Ubuntu terminal · example output</text>
  <text x="30" y="88" fill="#d7ed62" font-family="monospace" font-size="15">$ cat /etc/os-release</text>
  <text x="30" y="112" fill="#f7f4ec" font-family="monospace" font-size="14">PRETTY_NAME="Ubuntu 24.04.5 LTS"</text>
  <text x="30" y="148" fill="#d7ed62" font-family="monospace" font-size="15">$ whoami</text>
  <text x="30" y="172" fill="#f7f4ec" font-family="monospace" font-size="14">codespace</text>
  <text x="30" y="208" fill="#d7ed62" font-family="monospace" font-size="15">$ pwd</text>
  <text x="30" y="232" fill="#f7f4ec" font-family="monospace" font-size="14">/workspaces/linux-for-beginners</text>
  <text x="30" y="268" fill="#d7ed62" font-family="monospace" font-size="15">$ hostname</text>
  <text x="30" y="292" fill="#f7f4ec" font-family="monospace" font-size="14">codespaces-example</text>
  <rect x="477" y="251" width="253" height="54" rx="9" fill="#26334b" stroke="#71809d"/>
  <text x="495" y="274" fill="#ffb59f" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Your hostname will differ.</text>
  <text x="495" y="292" fill="#d2d7e2" font-family="system-ui, sans-serif" font-size="11">Use the text output as the exact reference.</text>
</svg>
