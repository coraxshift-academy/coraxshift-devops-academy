# Monitoring lab. Start everything:  docker compose up -d --build
# Stop and delete everything:        docker compose down -v
services:
  shop-app:
    build: ./app
    environment:
      LOG_FILE: /logs/shop.log
    volumes:
      - ./logs:/logs
    ports:
      - "8000:8000"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  alert-receiver:
    image: python:3.12-slim
    command: ["python", "/receiver.py"]
    volumes:
      - ./alert-receiver/receiver.py:/receiver.py:ro

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.5.0
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/logs:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lab-only-change-me
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
