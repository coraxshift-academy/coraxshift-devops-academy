groups:
  - name: shop-recording
    rules:
      # A saved calculation, so dashboards and alerts share one definition.
      - record: shop:order_error_ratio:rate1m
        expr: |
          sum(rate(shop_orders_total{status="failed"}[1m]))
          /
          sum(rate(shop_orders_total[1m]))

  - name: shop-alerts
    rules:
      - alert: ShopDown
        expr: up{job="shop-app"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "The shop app is not answering (up == 0)"

      - alert: HighOrderErrors
        expr: shop:order_error_ratio:rate1m > 0.2
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "More than 20% of orders are failing"
          description: "Error ratio is {{ $value | humanizePercentage }}."
