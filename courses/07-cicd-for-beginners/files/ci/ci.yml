# Continuous integration: runs on every pull request.
# Copy this file to .github/workflows/ci.yml in your repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Build the image
        run: docker build -t coraxshift-cicd-demo:${{ github.sha }} .
