global:
  scrape_interval: 5s        # how often to collect numbers (short, so labs feel quick)
  evaluation_interval: 5s    # how often to check the alert rules

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: shop-app
    static_configs:
      - targets: ["shop-app:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
